<app-navigation></app-navigation>

<section class="signin-page">
  <div class="container signin-wrap">
    <div class="signin-card">
      <h1>Sign In</h1>
      <p class="signin-subtitle">Welcome back! Please enter your details.</p>

      <form class="signin-form" #signInForm="ngForm" (ngSubmit)="onSubmit(signInForm)" novalidate>
        <label>
          <span>Email address</span>
          <input
            type="email"
            name="email"
            placeholder="Enter your email"
            [(ngModel)]="signInData.email"
            required
            email
          >
        </label>

        <label>
          <span>Password</span>
          <div class="password-input-wrap">
            <input
              [type]="showPassword ? 'text' : 'password'"
              name="password"
              placeholder="Enter your password"
              [(ngModel)]="signInData.password"
              required
            >
            <button
              type="button"
              class="toggle-password-btn"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            >
              <svg *ngIf="!showPassword" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M12 5C6.5 5 2.1 8.4 1 12c1.1 3.6 5.5 7 11 7s9.9-3.4 11-7c-1.1-3.6-5.5-7-11-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"></path>
              </svg>
              <svg *ngIf="showPassword" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M2 4.3 3.3 3 21 20.7 19.7 22l-2.2-2.2A12.7 12.7 0 0 1 12 21c-5.5 0-9.9-3.4-11-7 .5-1.7 1.8-3.3 3.5-4.6L2 4.3zm5.2 5.2A4 4 0 0 0 12 16a4 4 0 0 0 2.5-.9l-1.4-1.4a2 2 0 0 1-2.7-2.7L9 9.6c-.6.4-1.2 1-1.8 1.6zm14.8 2.5c-.4 1.2-1.2 2.4-2.2 3.4l-1.4-1.4a8 8 0 0 0 1.2-2c-1.1-3-4.4-5.5-8.6-5.5-1 0-2 .1-2.8.4L6.7 5.5A12 12 0 0 1 12 5c5.5 0 9.9 3.4 11 7z"></path>
              </svg>
            </button>
          </div>
        </label>

        <div class="signin-actions">
          <label class="remember-me">
            <input type="checkbox">
            <span>Remember me</span>
          </label>
          <a routerLink="/forgot-password">Forgot password?</a>
        </div>

        <p *ngIf="feedbackMessage">{{ feedbackMessage }}</p>

        <button type="submit" [disabled]="isSubmitting || signInForm.invalid">
          {{ isSubmitting ? 'Signing In...' : 'Sign In' }}
        </button>
      </form>

      <div class="social-divider">or continue with</div>

      <div class="social-signin">
        <button type="button" class="social-btn" [disabled]="isSocialRedirecting" (click)="socialSignIn('google')">
          {{ isSocialRedirecting ? 'Redirecting to Google...' : 'Continue with Google' }}
        </button>
      </div>

      <p class="signup-copy">
        Don’t have an account?
        <a routerLink="/sign-up">Sign Up</a>
      </p>
    </div>
  </div>
</section>

<app-footer></app-footer>
