<nav class="navbar navbar-expand-lg header">
  <div class="container nav-container" [class.mobile-search-active]="isSearchOpen">

    <!-- LEFT: TOGGLER -->
    <button class="navbar-toggler stylish-toggler collapsed" type="button" data-bs-toggle="collapse"
      (click)="onMenuToggleClick($event)"
      data-bs-target="#mainNavbar" aria-label="Toggle navigation">
      <span class="toggler-line"></span>
      <span class="toggler-line"></span>
      <span class="toggler-line"></span>
    </button>


    <!-- CENTER: LOGO -->
    <a routerLink="/home" class="  order-lg-2 order-sm-2 navbar-brand d-flex  justify-content-center">
      <div class="header__heading-logo-wrapper">
        <img src="https://raw.githubusercontent.com/ashusharma1958/static/main/image/siesha-logo-light-ivory.svg" alt="Siesha" class="img-fluid">
      </div>
    </a>




    <!-- RIGHT ICONS -->
    <div class="align-items-center d-flex header-icons-wrap justify-content-end order-lg-3">
      <div class="nav-search-form" *ngIf="isSearchOpen">
        <div class="nav-search-row">
          <i class="bi bi-search nav-search-inline-icon" aria-hidden="true"></i>
          <input
            type="search"
            name="productSearch"
            [(ngModel)]="searchTerm"
            (input)="onSearchInput()"
            (keydown)="onSearchKeydown($event)"
            (keydown.enter)="onSearchEnter($event)"
            class="nav-search-input"
            placeholder="Search by name, scent, mood..."
            autocomplete="off"
            maxlength="80">
        </div>

        <div class="nav-search-results" *ngIf="shouldShowSuggestions">
          <section class="nav-search-col nav-search-products">
            <h6>Suggested Products: {{ searchTerm.trim() }}</h6>

            <button
              type="button"
              class="nav-search-product-item"
              *ngFor="let product of suggestedProducts"
              (click)="selectProduct(product)">
              <img [src]="product.image" [alt]="product.alt || product.name">
              <div>
                <p>{{ product.name }}</p>
                <span>Rs. {{ getDisplayPrice(product) }}</span>
              </div>
            </button>

            <p class="nav-search-empty" *ngIf="suggestedProducts.length === 0">No products found</p>
          </section>
        </div>
      </div>

      <button type="button"
        class="header__icon header__icon--account link focus-inset small-hide nav-search-toggle"
        (click)="toggleSearch()"
        [attr.aria-label]="isSearchOpen ? 'Close search' : 'Search products'"
        [attr.aria-expanded]="isSearchOpen">
        <img *ngIf="!isSearchOpen" src="https://raw.githubusercontent.com/ashusharma1958/static/main/image/search-icon.svg" class="img-fluid">
        <i *ngIf="isSearchOpen" class="bi bi-x-lg nav-search-toggle-close" aria-hidden="true"></i>
      </button>

      <a [routerLink]="accountLink" class="header__icon header__icon--account link focus-inset small-hide desktop-header-action">
        <img src="https://raw.githubusercontent.com/ashusharma1958/static/main/image/icon-account.svg" class="img-fluid">
      </a>

      <a href="javascript:void(0)"
        class="header__icon link focus-inset desktop-header-action"
        data-bs-toggle="offcanvas"
        data-bs-target="#cartOffcanvas"
        aria-controls="cartOffcanvas">
        <img src="https://raw.githubusercontent.com/ashusharma1958/static/main/image/icon-cart-empty.svg" class="img-fluid">
      </a>
    </div>

    <!-- COLLAPSIBLE MENU -->
    <div class="collapse justify-content-start navbar-collapse order-lg-1" id="mainNavbar" (click)="onMobileMenuContentClick($event)">
      <div class="mobile-nav-utility d-lg-none">
        <div class="mobile-nav-actions">
          <a href="javascript:void(0)" (click)="onMobileAccountClick($event)" class="mobile-nav-action-link">Account</a>
          <a href="javascript:void(0)"
            class="mobile-nav-action-link"
            data-bs-toggle="offcanvas"
            data-bs-target="#cartOffcanvas"
            aria-controls="cartOffcanvas">Cart</a>
        </div>
      </div>

      <ul class="navbar-nav  mb-2 mb-lg-0 nav-left">
        <li class="nav-item">
          <a class="nav-link active" routerLink="/home">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/shop">Shop</a>
        </li>
        <li class="nav-item" *ngIf="!isAdmin">
          <a class="nav-link" routerLink="/contact-us">Contact Us</a>
        </li>
        <li class="nav-item" *ngIf="!isAdmin">
          <a class="nav-link" routerLink="/about-us">About Us</a>
        </li>
        <li class="nav-item" *ngIf="isAdmin">
          <a class="nav-link" routerLink="/admin/orders">Order Manage</a>
        </li>
        <li class="nav-item" *ngIf="isAdmin">
          <a class="nav-link" routerLink="/admin/vouchers">Voucher Management</a>
        </li>
        <li class="nav-item" *ngIf="isAdmin">
          <a class="nav-link" routerLink="/admin/queries">Queries</a>
        </li>
      </ul>
    </div>

  </div>
</nav>

<app-cart></app-cart>
