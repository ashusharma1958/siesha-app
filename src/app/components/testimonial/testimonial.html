<section class="container-fluid testimonial-wrap pt-5 pb-5">
  <div class="container  py-3">
    <div class="row g-4">
      <div class=" cust-rivew-info text-center mb-4">

        <h2 class="testimonial-title">Let customers speak for us</h2>
        <div class="review-count">
          from {{ reviews.length }} reviews <span class="verified">✔</span>
        </div>
      </div>

      <div class="col-12 text-center" *ngIf="isLoading">
        <p class="testimonial-state">Loading customer reviews...</p>
      </div>

      <div class="col-12 text-center" *ngIf="!isLoading && reviews.length === 0">
        <p class="testimonial-state">No customer reviews yet.</p>
      </div>

      <div class="col-md-4" *ngFor="let review of reviews; trackBy: trackByReview">
        <div class="testimonial-card shadow-sm">
          <div class="d-flex justify-content-between align-items-center">
            <div class="brand">{{ review.productName }}</div>
            <div class="rating">{{ review.rating }} <span>★</span></div>
          </div>

          <p class="quote">"{{ review.content }}"</p>

          <div>
            <div class="user-name">{{ review.author }}</div>

            <div class="review-date" *ngIf="review.date">{{ review.date }}</div>

          </div>
        </div>
      </div>

    </div>
  </div>
</section>
