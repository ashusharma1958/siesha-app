<section class="hero">
  <div class="hero-swiper">
    <div #swiperContainer class="swiper">
      <div class="swiper-wrapper">
        <div
          class="swiper-slide"
          *ngFor="let slide of slides; trackBy: trackBySlide"
          (click)="onSlideClick(slide)"
        >
          <img [src]="slide.image" [alt]="slide.alt" class="hero-image">
        </div>
      </div>
    </div>

    <div class="hero-controls">
      <div class="swiper-pagination"></div>
    </div>
  </div>
</section>
