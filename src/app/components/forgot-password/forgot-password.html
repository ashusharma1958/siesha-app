<app-navigation></app-navigation>

<section class="forgot-page">
  <div class="container forgot-wrap">
    <div class="forgot-card">
      <h1>Forgot Password</h1>
      <p class="forgot-subtitle">Enter your email and we will send you a secret code.</p>

      <form class="forgot-form" #forgotForm="ngForm" (ngSubmit)="onSubmit(forgotForm)" novalidate>
        <label>
          <span>Email address</span>
          <input
            type="email"
            name="email"
            placeholder="Enter your email"
            [(ngModel)]="payload.email"
            required
            email
          >
        </label>

        <p class="field-error" *ngIf="emailError">{{ emailError }}</p>

        <p
          *ngIf="feedbackType"
          class="forgot-feedback"
          [class.error]="feedbackType === 'error'"
          [class.success]="feedbackType === 'success'"
          role="alert"
        >
          {{ feedbackMessage }}
        </p>

        <p class="cooldown-copy" *ngIf="cooldownSecondsRemaining > 0">
          Please wait {{ cooldownSecondsRemaining }}s before trying again.
        </p>

        <button type="submit" [disabled]="isSubmitting || forgotForm.invalid || cooldownSecondsRemaining > 0">
          {{ isSubmitting ? 'Sending Code...' : 'Send Secret Code' }}
        </button>
      </form>

      <p class="signin-copy">
        Remember your password?
        <a routerLink="/sign-in">Sign In</a>
      </p>
    </div>
  </div>
</section>

<app-footer></app-footer>
