<div class="container">
  <div class="section-title">
    <h4>Choose Your Ritual</h4>
  </div>

  <div class="product-swiper">
    <div #swiperContainer class="swiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide" *ngFor="let product of products; trackBy: trackByProduct">
          <a class="product-card" [routerLink]="['/product', product.id]">
            <div class="product-img">
              <span class="sale" *ngIf="product.salePrice">Sale</span>
              <img [src]="product.image" [alt]="product.alt || product.name">
            </div>
            <h6>{{ product.name }}</h6>
            <div class="rating"
              [class.rating-hidden]="!shouldShowRating(product.rating, product.reviewCount)"
              [attr.aria-label]="shouldShowRating(product.rating, product.reviewCount) ? ('Rated ' + getRoundedRating(product.rating) + ' out of 5') : null"
              [attr.aria-hidden]="!shouldShowRating(product.rating, product.reviewCount)">
              {{ getRatingStars(product.rating) }}
              <span class="rating-reviews">{{ getReviewCount(product.reviewCount) }} {{ getReviewLabel(product.reviewCount) }}</span>
            </div>
            <p class="price" *ngIf="getDisplayPrice(product) as price">
              <del *ngIf="product.originalPrice">Rs.{{ product.originalPrice }}</del>
              Rs.{{ price }}
            </p>
            <button type="button" (click)="addToCart(product, $event)">Add to cart</button>
          </a>
        </div>
      </div>
    </div>

    <!-- Bottom Controls -->
    <div class="bottom-controls">
      <button class="custom-prev" (click)="prevSlide()">&lsaquo;</button>
      <div class="swiper-pagination"></div>
      <button class="custom-next" (click)="nextSlide()">&rsaquo;</button>
    </div>
  </div>
</div>
